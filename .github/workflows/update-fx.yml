name: Update KB STAR FX rate

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-fx.yml'
      - 'scripts/update_fx.py'

permissions:
  contents: write

concurrency:
  group: update-kb-star-fx
  cancel-in-progress: false

jobs:
  update-rate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install playwright

      - name: Update KB STAR FX rate
        run: python scripts/update_fx.py

      - name: Commit report.json when changed
        run: |
          if git diff --quiet -- report.json; then
            echo "No rate change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add report.json
          git commit -m "Update KB STAR FX rate"
          git push
