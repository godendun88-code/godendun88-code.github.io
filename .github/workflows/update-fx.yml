name: Update frequent FX rate and market news

on:
  schedule:
    # 혼잡한 정각을 피하고, 한 번의 예약 실행이 지연되어도 다음 실행이 보완합니다.
    - cron: '7,37 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-fx.yml'
      - 'scripts/update_fx.py'
      - 'scripts/update_news.py'

permissions:
  contents: write

concurrency:
  group: update-frequent-fx
  cancel-in-progress: false

jobs:
  update-rate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Update KB STAR FX rate and SMBS base rate
        run: python scripts/update_fx.py

      - name: Update market news and drivers
        continue-on-error: true
        run: python scripts/update_news.py

      - name: Commit dashboard data
        run: |
          if git diff --quiet -- report.json; then
            echo "No dashboard data change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add report.json
          git commit -m "Update frequent FX dashboard data"
          # 수집 중 생성되는 디버그 파일 변경은 배포 대상이 아니므로 정리합니다.
          git restore --worktree .
          git fetch origin main
          git rebase origin/main
          git push
