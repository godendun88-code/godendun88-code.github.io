name: Patch reconciliation XLS parser

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_reconciliation_xls.py'
      - '.github/workflows/patch-reconciliation-xls.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Patch index.html
        run: python scripts/patch_reconciliation_xls.py
      - name: Commit patch
        run: |
          if git diff --quiet -- index.html; then
            echo "No index.html changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Support legacy XLS financial statement validation"
          git push
