name: Update KB STAR FX rate and market news

on:
  schedule:
    - cron: '3,18,33,48 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-fx.yml'
      - 'scripts/update_fx.py'
      - 'scripts/update_news.py'

permissions:
  contents: write

concurrency:
  group: update-kb-star-fx
  cancel-in-progress: false

jobs:
  update-rate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Update KB STAR FX rate
        run: python scripts/update_fx.py

      - name: Update market news and drivers
        continue-on-error: true
        run: python scripts/update_news.py

      - name: Commit dashboard data and temporary network trace
        run: |
          if git diff --quiet -- report.json kb_network_debug.json; then
            echo "No dashboard data change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add report.json kb_network_debug.json
          git commit -m "Update FX dashboard data"
          git push
