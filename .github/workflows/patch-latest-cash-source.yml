name: Patch latest cash-plan source

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/patch-latest-cash-source.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch dashboard
        run: python scripts/patch_latest_cash_source.py
      - name: Validate and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-latest-cash-source.yml scripts/patch_latest_cash_source.py
          git add index.html
          git diff --cached --check
          git commit -m "Follow latest cash-plan workbook automatically"
          git push origin main
