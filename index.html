<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ACT 자금 대시보드</title>
  <style>
    html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f5f7fb;color:#172033}
    #boot{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center;color:#667085}
  </style>
</head>
<body>
  <div id="boot">ACT 자금 대시보드를 불러오는 중입니다.</div>
  <script>
    (async()=>{
      const base='https://raw.githubusercontent.com/godendun88-code/godendun88-code.github.io/56f5a5bf089efe5e6ecb067e5f70aba58abf3d4f/index.html';
      const response=await fetch(base,{cache:'no-store'});
      if(!response.ok)throw new Error('기본 대시보드 로드 실패 ('+response.status+')');
      let html=await response.text();
      const replaceRequired=(source,next,label)=>{
        if(!html.includes(source))throw new Error(label+' 코드를 찾지 못했습니다. 기본 대시보드 버전을 확인해 주세요.');
        html=html.replace(source,next);
      };
      const originalReconciliationFileHandler="$('reconcileFile').addEventListener('change',async event=>{const file=event.target.files?.[0];if(!file)return;reconcileBusy=true;renderReconciliationDraft();try{await importReconciliationFile(file)}catch(error){$('reconcileSaveStatus').textContent='파일 확인 필요: '+(error.message||String(error))}finally{reconcileBusy=false;event.target.value='';renderReconciliationDraft()}});";
      const retainedReconciliationFileHandler="$('reconcileFile').addEventListener('click',event=>{event.currentTarget.value=''});$('reconcileFile').addEventListener('change',async event=>{const file=event.target.files?.[0];if(!file)return;reconcileBusy=true;renderReconciliationDraft();try{await importReconciliationFile(file)}catch(error){$('reconcileSaveStatus').textContent='파일 확인 필요: '+(error.message||String(error))}finally{reconcileBusy=false;renderReconciliationDraft()}});";
      replaceRequired(originalReconciliationFileHandler,retainedReconciliationFileHandler,'재무제표 파일 선택');

      const originalFxBookField='<label>월말 외화예금 장부금액 합계(원)<input id="reconcileFxBook" type="number" step="1" inputmode="numeric" placeholder="장부에서 확인한 원화 금액"></label>';
      const splitLedgerFields='<label>월말 원화예금 장부금액 합계(원)<input id="reconcileKrwBook" type="number" step="1" inputmode="numeric" placeholder="원화예금 명세 기준"></label>'+originalFxBookField;
      replaceRequired(originalFxBookField,splitLedgerFields,'원화예금 장부금액 입력');

      replaceRequired(
        "fxBook:reconciliationNumber(values.fxBook),shortBook:",
        "krwBook:reconciliationNumber(values.krwBook),fxBook:reconciliationNumber(values.fxBook),shortBook:",
        '원화예금 검증값'
      );
      replaceRequired(
        "['reconcileBalanceBasis','basis'],['reconcileFxBook','fxBook'],",
        "['reconcileBalanceBasis','basis'],['reconcileKrwBook','krwBook'],['reconcileFxBook','fxBook'],",
        '원화예금 불러오기'
      );
      replaceRequired(
        "basis:$('reconcileBalanceBasis').value,fxBook:$('reconcileFxBook').value,",
        "basis:$('reconcileBalanceBasis').value,krwBook:$('reconcileKrwBook').value,fxBook:$('reconcileFxBook').value,",
        '원화예금 저장'
      );
      replaceRequired(
        "'reconcileBalanceBasis','reconcileFxBook','reconcileShortBook'",
        "'reconcileBalanceBasis','reconcileKrwBook','reconcileFxBook','reconcileShortBook'",
        '원화예금 초기화'
      );
      replaceRequired(
        "'reconcileBalanceBasis','reconcileFxBook','reconcileShortBook'",
        "'reconcileBalanceBasis','reconcileKrwBook','reconcileFxBook','reconcileShortBook'",
        '원화예금 초기화'
      );
      replaceRequired(
        "'reconcileBalanceBasis','reconcileFxBook','reconcileShortBook'",
        "'reconcileBalanceBasis','reconcileKrwBook','reconcileFxBook','reconcileShortBook'",
        '원화예금 입력'
      );
      replaceRequired(
        "const bankActual=source.krw==null?null:inputs.basis==='bank-book-total'?source.krw:inputs.basis==='krw-only'&&inputs.fxBook!=null?source.krw+inputs.fxBook:null;",
        "const manualBankTotal=inputs.krwBook!=null&&inputs.fxBook!=null?inputs.krwBook+inputs.fxBook:null;const bankActual=manualBankTotal??(source.krw==null?null:inputs.basis==='bank-book-total'?source.krw:inputs.basis==='krw-only'&&inputs.fxBook!=null?source.krw+inputs.fxBook:null);",
        '보통예금 합산'
      );
      replaceRequired(
        "if(source.krw==null)blockers.push(source.duplicate?'동일 월 원본이 중복되어 있습니다.':'해당 월 원본 시트 잔고가 없습니다.');",
        "if(source.krw==null&&manualBankTotal==null)blockers.push(source.duplicate?'동일 월 원본이 중복되어 있습니다.':'해당 월 원본 시트 잔고가 없습니다.');",
        '월 시트 잔고 확인'
      );
      replaceRequired(
        "if(!inputs.basis)blockers.push('월 시트 잔고 포함 범위 선택 필요');",
        "if(!inputs.basis&&manualBankTotal==null)blockers.push('월 시트 잔고 포함 범위 선택 필요');",
        '월 시트 잔고 범위 확인'
      );
      replaceRequired(
        "if(inputs.basis&&inputs.fxBook==null)blockers.push('해당 월 외화예금 장부금액 필요 · 원화/외화 분리 확인용');",
        "if(inputs.krwBook==null)blockers.push('해당 월 원화예금 장부금액 필요');if(inputs.fxBook==null)blockers.push('해당 월 외화예금 장부금액 필요');",
        '보통예금 검증 조건'
      );
      replaceRequired(
        "for(const key of ['fxBook','shortBook'])",
        "for(const key of ['krwBook','fxBook','shortBook'])",
        '원화예금 금액 검증'
      );
      const originalShortBookLock="$('reconcileFxBook').disabled=false;$('reconcileShortBook').disabled=!check.shortRequired;";
      const retainedShortBookInput="$('reconcileKrwBook').disabled=false;$('reconcileFxBook').disabled=false;$('reconcileShortBook').disabled=false;$('reconcileShortBook').placeholder='해당 월말 금액 (없으면 0)';$('reconcileCashBook').disabled=!check.cashRequired;$('reconcileCashBook').placeholder=check.cashRequired?'해당 월 실제 보유 현금':'재무제표 현금 계정이 없으면 입력 불필요';";
      replaceRequired(originalShortBookLock,retainedShortBookInput,'장부금액 입력');

      replaceRequired(
        "if(!['보통예금','기타단기금융상품'].includes(label)){",
        "if(!['보통예금','기타단기금융상품','현금'].includes(label)){",
        '현금 계정 인식'
      );
      replaceRequired(
        "shortAmount:amounts['기타단기금융상품']??null,fileName:",
        "shortAmount:amounts['기타단기금융상품']??null,cashAmount:amounts['현금']??null,fileName:",
        '현금 금액 저장'
      );
      replaceRequired(
        "shortCell:refs['기타단기금융상품']||'',unsupported:",
        "shortCell:refs['기타단기금융상품']||'',cashCell:refs['현금']||'',unsupported:",
        '현금 셀 위치 저장'
      );
      replaceRequired(
        "function reconciliationInputs(values={}){return{basis:['krw-only','bank-book-total'].includes(values.basis)?values.basis:'',krwBook:reconciliationNumber(values.krwBook),fxBook:reconciliationNumber(values.fxBook),shortBook:reconciliationNumber(values.shortBook),usdEvidence:reconciliationNumber(values.usdEvidence),note:String(values.note||'').trim().slice(0,300),unitReviewed:values.unitReviewed===true,actualReviewed:values.actualReviewed===true}}",
        "function reconciliationInputs(values={}){const result={basis:['krw-only','bank-book-total'].includes(values.basis)?values.basis:'',krwBook:reconciliationNumber(values.krwBook),fxBook:reconciliationNumber(values.fxBook),shortBook:reconciliationNumber(values.shortBook),usdEvidence:reconciliationNumber(values.usdEvidence),note:String(values.note||'').trim().slice(0,300),unitReviewed:values.unitReviewed===true,actualReviewed:values.actualReviewed===true};if(values.cashBook!=null&&values.cashBook!=='')result.cashBook=reconciliationNumber(values.cashBook);return result}",
        '현금 검증값'
      );
      const originalShortBookField='<label>동일 월말 기타단기금융상품 잔액(원)<input id="reconcileShortBook" type="number" step="1" inputmode="numeric" placeholder="해당 월 운용명세 기준"></label>';
      const cashBookField=originalShortBookField+'<label>동일 월말 현금 잔액(원)<input id="reconcileCashBook" type="number" step="1" inputmode="numeric" placeholder="현금출납부·금고 기준"></label>';
      replaceRequired(originalShortBookField,cashBookField,'현금 장부금액 입력');
      replaceRequired(
        "['reconcileBalanceBasis','basis'],['reconcileKrwBook','krwBook'],['reconcileFxBook','fxBook'],['reconcileShortBook','shortBook'],",
        "['reconcileBalanceBasis','basis'],['reconcileKrwBook','krwBook'],['reconcileFxBook','fxBook'],['reconcileShortBook','shortBook'],['reconcileCashBook','cashBook'],",
        '현금 입력값 불러오기'
      );
      replaceRequired(
        "basis:$('reconcileBalanceBasis').value,krwBook:$('reconcileKrwBook').value,fxBook:$('reconcileFxBook').value,shortBook:$('reconcileShortBook').value,",
        "basis:$('reconcileBalanceBasis').value,krwBook:$('reconcileKrwBook').value,fxBook:$('reconcileFxBook').value,shortBook:$('reconcileShortBook').value,cashBook:$('reconcileCashBook').value,",
        '현금 입력값 저장'
      );
      replaceRequired(
        "const valid=!!statement&&statement.month===record.month&&reconciliationMonthPattern.test(record.month)&&statement.date===reconciliationMonthEnd(record.month)&&[1,1000,1000000].includes(statement.unit)&&Number.isSafeInteger(statement.bankAmount);",
        "const valid=!!statement&&statement.month===record.month&&reconciliationMonthPattern.test(record.month)&&statement.date===reconciliationMonthEnd(record.month)&&[1,1000,1000000].includes(statement.unit)&&Number.isSafeInteger(statement.bankAmount)&&(statement.cashAmount==null||Number.isSafeInteger(statement.cashAmount));",
        '현금 재무제표 값 검증'
      );
      replaceRequired(
        "const bankDiff=valid&&bankActual!=null?bankActual-statement.bankAmount:null,shortRequired=statement?.shortAmount!=null,shortDiff=shortRequired&&inputs.shortBook!=null?inputs.shortBook-statement.shortAmount:null;",
        "const bankDiff=valid&&bankActual!=null?bankActual-statement.bankAmount:null,shortRequired=statement?.shortAmount!=null,shortDiff=shortRequired&&inputs.shortBook!=null?inputs.shortBook-statement.shortAmount:null,cashRequired=statement?.cashAmount!=null,cashDiff=cashRequired&&inputs.cashBook!=null?inputs.cashBook-statement.cashAmount:null;",
        '현금 차이 계산'
      );
      replaceRequired(
        "if(shortRequired&&shortDiff!==0)blockers.push(shortDiff==null?'동일 월 기타단기금융상품 명세 필요':'기타단기금융상품 차액 확인 필요');",
        "if(shortRequired&&shortDiff!==0)blockers.push(shortDiff==null?'동일 월 기타단기금융상품 명세 필요':'기타단기금융상품 차액 확인 필요');if(cashRequired&&cashDiff!==0)blockers.push(cashDiff==null?'동일 월 현금 잔액 명세 필요':'현금 차액 확인 필요');",
        '현금 검증 조건'
      );
      replaceRequired(
        "for(const key of ['krwBook','fxBook','shortBook'])",
        "for(const key of ['krwBook','fxBook','shortBook','cashBook'])",
        '현금 원단위 검증'
      );
      replaceRequired(
        "return{inputs,source,bankActual,bankDiff,shortRequired,shortDiff,usdDiff,usdPass,blockers,fingerprint,canConfirm,confirmed,stale:!!record?.confirmation&&!confirmed};",
        "return{inputs,source,bankActual,bankDiff,shortRequired,shortDiff,cashRequired,cashDiff,usdDiff,usdPass,blockers,fingerprint,canConfirm,confirmed,stale:!!record?.confirmation&&!confirmed};",
        '현금 검증 결과 표시'
      );
      replaceRequired(
        "...(check.shortRequired?[['기타단기금융상품',s.shortAmount,check.inputs.shortBook,check.shortDiff,false]]:[]),['USD 수량(독립 명세 대조)'",
        "...(check.shortRequired?[['기타단기금융상품',s.shortAmount,check.inputs.shortBook,check.shortDiff,false]]:[]),...(check.cashRequired?[['현금',s.cashAmount,check.inputs.cashBook,check.cashDiff,false]]:[]),['USD 수량(독립 명세 대조)'",
        '현금 대조행 표시'
      );
      replaceRequired(
        "||s.shortAmount!=null&&!Number.isSafeInteger(s.shortAmount))throw new Error('유효한 월말 재무제표가 필요합니다.');",
        "||s.shortAmount!=null&&!Number.isSafeInteger(s.shortAmount)||s.cashAmount!=null&&!Number.isSafeInteger(s.cashAmount))throw new Error('유효한 월말 재무제표가 필요합니다.');",
        '현금 보호저장소 검증'
      );
      replaceRequired(
        "shortAmount:s.shortAmount??null,fileName:String(s.fileName||'').slice(0,200),",
        "shortAmount:s.shortAmount??null,cashAmount:s.cashAmount??null,fileName:String(s.fileName||'').slice(0,200),",
        '현금 보호저장소 저장'
      );
      replaceRequired(
        "shortCell:String(s.shortCell||''),unsupported:",
        "shortCell:String(s.shortCell||''),cashCell:String(s.cashCell||''),unsupported:",
        '현금 셀 위치 보호저장소 저장'
      );
      replaceRequired(
        "'reconcileBalanceBasis','reconcileKrwBook','reconcileFxBook','reconcileShortBook'",
        "'reconcileBalanceBasis','reconcileKrwBook','reconcileFxBook','reconcileShortBook','reconcileCashBook'",
        '현금 입력 초기화'
      );
      replaceRequired(
        "'reconcileBalanceBasis','reconcileKrwBook','reconcileFxBook','reconcileShortBook'",
        "'reconcileBalanceBasis','reconcileKrwBook','reconcileFxBook','reconcileShortBook','reconcileCashBook'",
        '현금 입력 초기화'
      );
      replaceRequired(
        "'reconcileBalanceBasis','reconcileKrwBook','reconcileFxBook','reconcileShortBook'",
        "'reconcileBalanceBasis','reconcileKrwBook','reconcileFxBook','reconcileShortBook','reconcileCashBook'",
        '현금 입력 초기화'
      );
      const monthlyUsdFallback=`<script>
(() => {
  const monthPattern=/^20\\d{2}-(0[1-9]|1[0-2])$/;
  const cacheKey='act.monthlyUsdFallback.v1';
  const isPast=month=>month<new Date().getFullYear()+'-'+String(new Date().getMonth()+1).padStart(2,'0');
  const readCache=()=>{try{return JSON.parse(localStorage.getItem(cacheKey)||'{}')}catch{return {}}};
  const writeCache=values=>{try{localStorage.setItem(cacheKey,JSON.stringify(values))}catch{}};
  const insertRow=(month,value='')=>{
    if(!monthPattern.test(month)||!isPast(month)||document.querySelector('[data-monthly-usd="'+month+'"]'))return;
    const body=document.getElementById('monthlyUsdInputBody');
    if(!body)return;
    const row=document.createElement('tr');
    row.dataset.monthlyFallback=month;
    row.innerHTML='<td>'+month+'</td><td>미확정</td><td>과거 USD 실제 잔액 보완 입력</td><td><input data-monthly-usd="'+month+'" aria-label="'+month+' USD 월말잔액" type="number" step="0.01" inputmode="decimal" placeholder="USD 숫자만 입력" value="'+String(value??'').replace(/&/g,'&amp;').replace(/\"/g,'&quot;')+'"></td><td>입력 후 저장</td>';
    const rows=[...body.querySelectorAll('tr')];
    const before=rows.find(item=>(item.querySelector('[data-monthly-usd]')?.dataset.monthlyUsd||'')>month);
    if(before)body.insertBefore(row,before);else body.appendChild(row);
  };
  const restore=()=>{const values=readCache();Object.entries(values).forEach(([month,value])=>insertRow(month,value));};
  const bind=()=>{
    const button=document.getElementById('monthlyUsdAddMonthBtn');
    if(!button||button.dataset.monthlyFallbackBound)return false;
    button.dataset.monthlyFallbackBound='1';
    button.addEventListener('click',event=>{
      const picker=document.getElementById('monthlyUsdAddMonthInput');
      const month=picker?.value||'';
      if(!monthPattern.test(month)||!isPast(month)||document.querySelector('[data-monthly-usd="'+month+'"]'))return;
      event.preventDefault();event.stopImmediatePropagation();
      insertRow(month);
      const status=document.getElementById('monthlyUsdAddMonthStatus');
      if(status)status.textContent=month+' 실제 USD 잔액 입력란을 추가했습니다. 입력 후 아래 저장 버튼을 누르세요.';
      if(picker)picker.value='';
      document.querySelector('[data-monthly-usd="'+month+'"]')?.focus();
    },true);
    const save=document.getElementById('monthlyUsdSaveBtn');
    save?.addEventListener('click',()=>{
      const values=readCache();
      document.querySelectorAll('[data-monthly-usd]').forEach(input=>{
        const amount=Number(input.value);if(monthPattern.test(input.dataset.monthlyUsd||'')&&Number.isFinite(amount))values[input.dataset.monthlyUsd]=amount;
      });
      writeCache(values);
    },true);
    restore();
    return true;
  };
  let tries=0;const timer=setInterval(()=>{bind();restore();if(++tries>40)clearInterval(timer)},250);
})();
<\/script>`;
      const monthlyFxEditor=`<script>
(() => {
  const cacheKey='act.monthlyFxRates.v1';
  const read=()=>{try{return JSON.parse(localStorage.getItem(cacheKey)||'{}')}catch{return {}}};
  const write=values=>{try{localStorage.setItem(cacheKey,JSON.stringify(values))}catch{}};
  let originalRateFunction=null;
  const install=()=>{
    if(originalRateFunction||typeof currentMonthlyFx!=='function')return !!originalRateFunction;
    originalRateFunction=currentMonthlyFx;
    currentMonthlyFx=function(month,referenceRate,status=''){
      const saved=Number(read()[month]);
      if(Number.isFinite(saved)&&saved>0)return {appliedRate:saved,fxBasis:'month-end',fxLabel:'관리자 등록 월말환율'};
      return originalRateFunction(month,referenceRate,status);
    };
    return true;
  };
  const render=()=>{
    const note=document.getElementById('currentHistoryFxNote');
    if(!note||document.getElementById('monthlyFxEditor'))return;
    const box=document.createElement('div');
    box.id='monthlyFxEditor';
    box.style.cssText='display:block;margin-top:10px;padding:12px;border:1px solid #bfdbfe;border-radius:10px;background:#eff6ff;font-size:13px';
    box.innerHTML='<strong>2026-08 월말환율 입력</strong><div style="margin:6px 0;color:#475467">서울외국환중개 월말 매매기준율의 USD 값을 입력하세요. 이 브라우저에 저장되며, Excel은 변경하지 않습니다.</div><input id="monthlyFxMonth" type="month" value="2026-08" min="2026-01" style="padding:7px;margin-right:6px"><input id="monthlyFxRate" type="number" step="0.01" min="0" placeholder="원/USD" style="padding:7px;width:120px;margin-right:6px"><button type="button" id="monthlyFxSave">월말환율 저장</button><span id="monthlyFxStatus" style="margin-left:8px;color:#475467"></span>';
    note.appendChild(box);
    document.getElementById('monthlyFxSave').addEventListener('click',()=>{
      const month=document.getElementById('monthlyFxMonth').value;
      const rate=Number(document.getElementById('monthlyFxRate').value);
      const status=document.getElementById('monthlyFxStatus');
      if(!/^20\\d{2}-(0[1-9]|1[0-2])$/.test(month)||!Number.isFinite(rate)||rate<=0){status.textContent='월과 원/USD 환율을 확인해 주세요.';return}
      const saved=read();saved[month]=rate;write(saved);
      status.textContent=month+' 월말환율 '+rate.toLocaleString('ko-KR',{minimumFractionDigits:2,maximumFractionDigits:2})+'원/USD를 저장했습니다.';
      try{if(typeof cashModel!=='undefined'&&cashModel)renderCurrentOverview(cashModel)}catch{}
    });
  };
  let tries=0;const timer=setInterval(()=>{install();render();if(++tries>40)clearInterval(timer)},250);
})();
<\/script>`;
      const patches=[
        '<script src="./monthly-usd-patch.js?v=20260917-11"><\/script>',
        '<script src="./reconciliation-xls-patch.js?v=20260917-10"><\/script>',
        monthlyUsdFallback,
        monthlyFxEditor
      ].join('\n');
      html=html.includes('</body>')?html.replace('</body>',patches+'\n</body>'):html+patches;
      document.open();
      document.write(html);
      document.close();
    })().catch(error=>{
      document.getElementById('boot').innerHTML='<strong>대시보드를 불러오지 못했습니다.</strong><br>'+String(error.message||error)+'<br><br>새로고침해 주세요.';
    });
  </script>
</body>
</html>
