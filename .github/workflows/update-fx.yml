name: Update hourly FX rate and market news

on:
  schedule:
    # 매시간 17분에 실행합니다. GitHub 예약 실행은 수 분 지연될 수 있습니다.
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-fx.yml'
      - 'scripts/update_fx.py'
      - 'scripts/update_news.py'

permissions:
  contents: write

concurrency:
  group: update-hourly-fx
  cancel-in-progress: true

jobs:
  update-rate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Update KB STAR FX rate and SMBS base rate
        run: python scripts/update_fx.py

      - name: Update market news and drivers
        continue-on-error: true
        run: python scripts/update_news.py

      - name: Commit dashboard data
        run: |
          if git diff --quiet -- report.json; then
            echo "No dashboard data change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add report.json
          git commit -m "Update hourly FX dashboard data"
          git push
