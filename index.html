<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>USD/KRW Daily FX Dashboard</title><style>body{font-family:system-ui,sans-serif;background:#f5f7fb;margin:0;padding:30px;color:#172033}.box{max-width:900px;margin:auto;background:#fff;border:1px solid #e7eaf0;border-radius:16px;padding:24px}.muted{color:#667085;font-size:13px}.row{display:flex;gap:16px;flex-wrap:wrap}.kpi{flex:1;min-width:180px;padding:16px;border:1px solid #e7eaf0;border-radius:12px}.big{font-size:32px;font-weight:800;margin-top:8px}.report{white-space:pre-wrap;line-height:1.7;margin-top:20px;padding:16px;border:1px solid #e7eaf0;border-radius:12px;background:#fbfcfe}button{margin-top:16px;padding:9px 12px;border:1px solid #e7eaf0;border-radius:10px;background:#fff;font-weight:700}</style></head><body><div class="box"><h1>USD/KRW Daily FX Dashboard</h1><div class="muted">현재 환율 · 당일 주요 원인 · 향후 전망</div><div class="row" style="margin-top:20px"><div class="kpi"><div class="muted">현재 환율</div><div class="big" id="rate">-</div><div id="change" class="muted">-</div></div><div class="kpi"><div class="muted">단기 추세 신호</div><div class="big" id="signal">-</div><div id="updated" class="muted">-</div></div></div><div class="report" id="report">데이터를 불러오는 중입니다.</div><button onclick="load()">새로고침</button></div><script>async function load(){const r=await fetch('./report.json?t='+Date.now(),{cache:'no-store'});const j=await r.json();const c=Number(j.current_rate),p=Number(j.previous_close);document.getElementById('rate').textContent=(Number.isFinite(c)?c.toLocaleString('ko-KR',{minimumFractionDigits:1,maximumFractionDigits:1}):'-')+'원';if(Number.isFinite(c)&&Number.isFinite(p)){const d=c-p;document.getElementById('change').textContent=(d>=0?'+':'')+d.toFixed(1)+'원 (전일 종가 대비)'}document.getElementById('signal').textContent=j.market_bias||'-';document.getElementById('updated').textContent=j.rate_updated_at_kst||j.updated_at_kst||'';const ds=j.drivers||[];document.getElementById('report').textContent=['① '+(ds[0]||''),'② '+(ds[1]||''),'③ '+(ds[2]||''),'④ '+(j.outlook||'')].join('\n')}load();setInterval(load,3600000)</script></body></html>
